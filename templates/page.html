<!DOCTYPE html>
<html lang="{{language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142d43">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="icon" type="image/svg+xml" href="{{favicon}}">
  <link rel="stylesheet" href="{{storyCss}}">
  <link rel="stylesheet" href="{{labCss}}">
  <link rel="canonical" href="{{canonical}}">
  {{alternates}}
  <meta property="og:type" content="{{ogType}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta property="og:site_name" content="Smart Infrastructure Lab">
  {{robots}}
  <script src="{{siteJs}}" defer></script>
</head>
<body data-base-path="{{basePath}}" data-route="{{route}}">
{{header}}
<main id="main" tabindex="-1">{{body}}</main>
{{footer}}
</body>
</html>
